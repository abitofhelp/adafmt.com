<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
  <title id="title">Adafmt formatting pipeline</title>
  <desc id="desc">Unformatted Ada source passes through adafmt and becomes aligned formatted source.</desc>
  <defs>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="640" height="480" rx="28" fill="#0b1120"/>
  <circle cx="528" cy="84" r="120" fill="#38bdf8" opacity="0.12"/>
  <circle cx="104" cy="396" r="130" fill="#c4b5fd" opacity="0.1"/>

  <g filter="url(#shadow)">
    <rect x="42" y="58" width="250" height="172" rx="22" fill="url(#card)" stroke="#334155"/>
    <rect x="58" y="76" width="50" height="8" rx="4" fill="#f87171" opacity="0.85"/>
    <rect x="118" y="76" width="38" height="8" rx="4" fill="#fbbf24" opacity="0.85"/>
    <rect x="166" y="76" width="38" height="8" rx="4" fill="#34d399" opacity="0.85"/>
    <text x="60" y="116" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">procedure  Demo is</text>
    <text x="77" y="145" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">X:Integer:=1;</text>
    <text x="77" y="174" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">begin Put_Line("Ada");</text>
    <text x="60" y="203" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">end Demo;</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="348" y="250" width="250" height="172" rx="22" fill="url(#card)" stroke="#334155"/>
    <rect x="364" y="268" width="50" height="8" rx="4" fill="#7dd3fc" opacity="0.9"/>
    <rect x="424" y="268" width="38" height="8" rx="4" fill="#c4b5fd" opacity="0.9"/>
    <rect x="472" y="268" width="38" height="8" rx="4" fill="#a7f3d0" opacity="0.9"/>
    <text x="366" y="308" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">procedure Demo is</text>
    <text x="383" y="337" fill="#bfdbfe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">X : Integer := 1;</text>
    <text x="366" y="366" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">begin</text>
    <text x="383" y="395" fill="#bfdbfe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Put_Line ("Ada");</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="220" y="176" width="204" height="108" rx="28" fill="url(#accent)"/>
    <text x="265" y="236" fill="#07111f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="900" letter-spacing="-1.5">adafmt</text>
  </g>

  <path d="M292 148 C344 146 367 163 389 190" fill="none" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 14"/>
  <path d="M391 190 l-18 -2 l9 16" fill="#7dd3fc"/>
  <path d="M266 286 C290 332 319 356 350 360" fill="none" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 14"/>
  <path d="M350 360 l-15 -10 l1 18" fill="#c4b5fd"/>

  <g opacity="0.82">
    <rect x="72" y="278" width="162" height="42" rx="21" fill="#111827" stroke="#334155"/>
    <circle cx="94" cy="299" r="6" fill="#fde68a"/>
    <text x="110" y="305" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">safe backups</text>
  </g>
  <g opacity="0.82">
    <rect x="380" y="78" width="186" height="42" rx="21" fill="#111827" stroke="#334155"/>
    <circle cx="402" cy="99" r="6" fill="#7dd3fc"/>
    <text x="418" y="105" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Ada 2022 ready</text>
  </g>
</svg>
