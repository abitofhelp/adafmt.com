<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" role="img" aria-labelledby="title desc">
  <title id="title">Adafmt validation pyramid</title>
  <desc id="desc">A layered validation pyramid showing safety checks, a 51,000 plus Ada file test corpus, ACATS tests, and Ada 2022 feature coverage.</desc>
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="560" height="420" rx="28" fill="#0b1120"/>
  <circle cx="480" cy="70" r="120" fill="#7dd3fc" opacity="0.11"/>
  <circle cx="90" cy="330" r="130" fill="#c4b5fd" opacity="0.10"/>

  <g filter="url(#shadow)">
    <path d="M80 332 H480 L420 264 H140 Z" fill="#172033" stroke="#334155"/>
    <path d="M140 256 H420 L366 198 H194 Z" fill="#1b2841" stroke="#3b4b67"/>
    <path d="M194 190 H366 L326 142 H234 Z" fill="#20304e" stroke="#4a5b7c"/>
    <path d="M234 134 H326 L280 76 Z" fill="url(#g1)"/>
  </g>

  <text x="280" y="116" text-anchor="middle" fill="#07111f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="900">Ada 2022</text>
  <text x="280" y="222" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Relevant ACATS tests</text>
  <text x="280" y="286" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">51,000+ Ada files in the largest test corpus</text>
  <text x="280" y="316" text-anchor="middle" fill="#b7c4d9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">real-world open-source Ada corpus</text>

  <g transform="translate(72 56)">
    <rect width="154" height="48" rx="24" fill="#111827" stroke="#334155"/>
    <circle cx="24" cy="24" r="8" fill="#a7f3d0"/>
    <text x="42" y="29" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">Idempotency</text>
  </g>
  <g transform="translate(342 336)">
    <rect width="148" height="48" rx="24" fill="#111827" stroke="#334155"/>
    <circle cx="24" cy="24" r="8" fill="#fde68a"/>
    <text x="42" y="29" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">Backups</text>
  </g>

  <path d="M280 356 C228 356 190 344 160 318" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
  <path d="M280 356 C332 356 370 344 400 318" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
</svg>
